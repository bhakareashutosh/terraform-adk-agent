<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .card-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #F8FAFC;
      }
      .card-sub {
        font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
        font-size: 11.5px;
        fill: #94A3B8;
      }
      .step-num {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .header-label {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1.5px;
        fill: #64748B;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashMove 1.2s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
    </style>
  </defs>

  <rect width="1200" height="310" rx="18" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="2"/>

  <text x="600" y="34" text-anchor="middle" class="header-label">LIVE END-TO-END AGENT EXECUTION PIPELINE &amp; SAFETY GATE</text>

  <!-- Connecting Animated Tracks -->
  <line x1="225" y1="155" x2="265" y2="155" stroke="#60A5FA" stroke-width="2.5" class="flow-line"/>
  <line x1="455" y1="155" x2="495" y2="155" stroke="#A78BFA" stroke-width="2.5" class="flow-line"/>
  <line x1="705" y1="155" x2="745" y2="155" stroke="#FBBF24" stroke-width="2.5" class="flow-line"/>
  <line x1="945" y1="155" x2="985" y2="155" stroke="#34D399" stroke-width="2.5" class="flow-line"/>

  <!-- Traveling Glowing Data Packet across pipeline -->
  <circle r="5.5" cy="155" fill="#38BDF8" filter="url(#neonGlow)">
    <animate attributeName="cx" values="130;360;600;845;1080" keyTimes="0;0.25;0.5;0.78;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#38BDF8;#A78BFA;#38BDF8;#FBBF24;#10B981" keyTimes="0;0.25;0.5;0.78;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- STAGE 1: User Request -->
  <g transform="translate(35, 68)">
    <rect width="190" height="175" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="16" width="68" height="22" rx="11" fill="#0C2D48"/>
    <text x="50" y="31" text-anchor="middle" fill="#38BDF8" class="step-num">STEP 01</text>

    <circle cx="95" cy="78" r="22" fill="#0C2D48" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="95" y="84" text-anchor="middle" font-size="18" fill="#7DD3FC">&#128172;</text>

    <text x="95" y="124" text-anchor="middle" class="card-title">User Prompt</text>
    <text x="95" y="145" text-anchor="middle" class="card-sub">Natural language</text>
    <text x="95" y="162" text-anchor="middle" class="card-sub">infra specification</text>
  </g>

  <!-- STAGE 2: Write TF File -->
  <g transform="translate(265, 68)">
    <rect width="190" height="175" rx="14" fill="#111827" stroke="#8B5CF6" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="16" width="68" height="22" rx="11" fill="#2E1065"/>
    <text x="50" y="31" text-anchor="middle" fill="#C4B5FD" class="step-num">STEP 02</text>

    <circle cx="95" cy="78" r="22" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="95" y="84" text-anchor="middle" font-size="17" fill="#DDD6FE">&#9997;</text>

    <text x="95" y="124" text-anchor="middle" class="card-title">write_tf_file()</text>
    <text x="95" y="145" text-anchor="middle" class="card-sub">Sandboxed .tf HCL</text>
    <text x="95" y="162" text-anchor="middle" class="card-sub">/app/workspace</text>
  </g>

  <!-- STAGE 3: Verify Terraform -->
  <g transform="translate(495, 68)">
    <rect width="210" height="175" rx="14" fill="#111827" stroke="#06B6D4" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="16" width="68" height="22" rx="11" fill="#083344"/>
    <text x="50" y="31" text-anchor="middle" fill="#67E8F9" class="step-num">STEP 03</text>

    <!-- Mini 4-step sub-badges -->
    <g transform="translate(22, 52)">
      <rect width="78" height="22" rx="6" fill="#0F172A" stroke="#0E7490"/>
      <text x="39" y="15" text-anchor="middle" class="card-sub" fill="#67E8F9">1. tf fmt</text>

      <rect x="88" width="78" height="22" rx="6" fill="#0F172A" stroke="#0E7490"/>
      <text x="127" y="15" text-anchor="middle" class="card-sub" fill="#67E8F9">2. tf init</text>

      <rect y="28" width="78" height="22" rx="6" fill="#0F172A" stroke="#0E7490"/>
      <text x="39" y="43" text-anchor="middle" class="card-sub" fill="#67E8F9">3. validate</text>

      <rect x="88" y="28" width="78" height="22" rx="6" fill="#0F172A" stroke="#0E7490"/>
      <text x="127" y="43" text-anchor="middle" class="card-sub" fill="#67E8F9">4. tf plan</text>
    </g>

    <text x="105" y="128" text-anchor="middle" class="card-title">verify_terraform()</text>
    <text x="105" y="148" text-anchor="middle" class="card-sub">Auto-validates &amp; builds</text>
    <text x="105" y="164" text-anchor="middle" class="card-sub">resource diff summary</text>
  </g>

  <!-- STAGE 4: Human Approval Gate -->
  <g transform="translate(745, 68)">
    <rect width="200" height="175" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="2">
      <animate attributeName="stroke" values="#F59E0B;#10B981;#F59E0B" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="16" width="82" height="22" rx="11" fill="#451A03"/>
    <text x="57" y="31" text-anchor="middle" fill="#FCD34D" class="step-num">GATE 04</text>

    <circle cx="100" cy="78" r="22" fill="#451A03" stroke="#F59E0B" stroke-width="1.5">
      <animate attributeName="r" values="20;24;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="84" text-anchor="middle" font-size="17" fill="#FDE68A">&#128737;</text>

    <text x="100" y="124" text-anchor="middle" class="card-title">Human Approval</text>
    <text x="100" y="145" text-anchor="middle" class="card-sub">Pauses until explicit</text>
    <text x="100" y="162" text-anchor="middle" class="card-sub" fill="#FCD34D">"yes" or "approve"</text>
  </g>

  <!-- STAGE 5: Apply Infrastructure -->
  <g transform="translate(985, 68)">
    <rect width="180" height="175" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.35;0.35;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="16" width="68" height="22" rx="11" fill="#064E3B"/>
    <text x="50" y="31" text-anchor="middle" fill="#6EE7B7" class="step-num">STEP 05</text>

    <circle cx="90" cy="78" r="22" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="84" text-anchor="middle" font-size="18" fill="#A7F3D0">&#9889;</text>

    <text x="90" y="124" text-anchor="middle" class="card-title">apply_terraform()</text>
    <text x="90" y="145" text-anchor="middle" class="card-sub">Provisions on</text>
    <text x="90" y="162" text-anchor="middle" class="card-sub" fill="#6EE7B7">Local • GCP • AWS</text>
  </g>

  <!-- Bottom Caption -->
  <text x="600" y="282" text-anchor="middle" class="card-sub">
    Self-healing loop: if verify_terraform() catches syntax or provider errors, Gemini inspects stderr, fixes .tf files &amp; re-verifies automatically.
  </text>
</svg>

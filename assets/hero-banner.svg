<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#844FBA">
        <animate attributeName="stop-color" values="#844FBA;#60A5FA;#34D399;#844FBA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#34D399;#A78BFA;#60A5FA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#A78BFA;#60A5FA;#34D399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #CBD5E1;
      }
      .mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 14px;
      }
      .pill-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .float-slow {
        animation: floatY 6s ease-in-out infinite;
      }
      .float-delayed {
        animation: floatY 7s ease-in-out 1.5s infinite;
      }
      .scanline {
        stroke-dasharray: 180 1020;
        animation: sweep 5s linear infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes sweep {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)" opacity="0.55"/>

  <!-- Animated Ambient Glow Orbs -->
  <circle cx="220" cy="110" r="210" fill="url(#orbPurple)">
    <animate attributeName="cx" values="200;290;200" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;150;100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="260" r="230" fill="url(#orbBlue)">
    <animate attributeName="cx" values="980;880;980" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="270;200;270" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="310" r="180" fill="url(#orbGreen)">
    <animate attributeName="r" values="160;220;160" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Sweeping Neon Border -->
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="18" fill="none" stroke="#38BDF8" stroke-width="2.5" class="scanline" filter="url(#glow)"/>

  <!-- Decorative Floating Terraform Blocks (Left) -->
  <g class="float-slow" opacity="0.85">
    <polygon points="85,135 120,115 120,155 85,175" fill="#7B42BC" opacity="0.8"/>
    <polygon points="125,115 160,135 160,175 125,155" fill="#5C4EE5" opacity="0.9"/>
    <polygon points="125,162 160,182 160,222 125,202" fill="#844FBA" opacity="0.75"/>
  </g>

  <!-- Decorative Floating Cloud / AI Nodes (Right) -->
  <g class="float-delayed" opacity="0.85">
    <circle cx="1085" cy="145" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="1085" cy="145" r="6" fill="#38BDF8">
      <animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="205" r="20" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="1035" cy="205" r="5" fill="#10B981">
      <animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="1068" y1="165" x2="1048" y2="190" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Top Eyebrow Pill -->
  <g transform="translate(415, 36)">
    <rect width="370" height="30" rx="15" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="195" y="19" text-anchor="middle" fill="#94A3B8" class="pill-text">GOOGLE ADK  •  GEMINI AI  •  TERRAFORM IaC</text>
  </g>

  <!-- Main Animated Gradient Title -->
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGrad)" class="title">ADK Terraform Automation Agent</text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" class="subtitle">
    Autonomous Infrastructure-as-Code Generation, Validation &amp; Human-Gated Provisioning
  </text>

  <!-- Animated Live Command Bar -->
  <g transform="translate(230, 204)">
    <rect width="740" height="54" rx="12" fill="#090D16" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <!-- macOS Traffic Lights -->
    <circle cx="22" cy="27" r="5.5" fill="#EF4444"/>
    <circle cx="40" cy="27" r="5.5" fill="#F59E0B"/>
    <circle cx="58" cy="27" r="5.5" fill="#10B981"/>

    <text x="82" y="32" fill="#38BDF8" class="mono">agent@adk-docker:~$</text>
    <text x="252" y="32" fill="#E2E8F0" class="mono">
      write_tf_file &#8594; terraform plan &#8594; [await human "approve"] &#8594; apply
    </text>
    <rect x="706" y="18" width="9" height="18" fill="#34D399" class="cursor"/>
  </g>

  <!-- Feature Pills Row -->
  <g transform="translate(175, 290)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="38" rx="19" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="97.5" y="23" text-anchor="middle" fill="#C4B5FD" class="pill-text">SANDBOXED WORKSPACE</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(215, 0)">
      <rect width="205" height="38" rx="19" fill="#0C2D48" stroke="#0EA5E9" stroke-width="1.2"/>
      <text x="102.5" y="23" text-anchor="middle" fill="#7DD3FC" class="pill-text">AUTO FMT • INIT • PLAN</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect width="205" height="38" rx="19" fill="#062E22" stroke="#10B981" stroke-width="1.2"/>
      <text x="102.5" y="23" text-anchor="middle" fill="#6EE7B7" class="pill-text">HUMAN APPROVAL GATE</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(665, 0)">
      <rect width="185" height="38" rx="19" fill="#271A0C" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="92.5" y="23" text-anchor="middle" fill="#FCD34D" class="pill-text">LOCAL • GCP • AWS</text>
    </g>
  </g>
</svg>
